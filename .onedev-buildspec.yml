version: 49
jobExecutor: remote-docker-executor

jobs:
  main_job:
    steps:
      # Use OneDev's built-in git checkout step
      - name: Checkout
        type: git-checkout

      # Leverage OneDev's Go test step for automated testing with dependency management
      - name: Test
        type: go-test
        image: golang:1.24-alpine

      # Use OneDev's Go build step for compilation
      - name: Build
        type: go-build
        image: golang:1.24-alpine
        output: server

      # Use OneDev's Docker build step with smart tagging
      - name: Docker Build
        type: docker-build
        image: docker:dind
        tags:
          - gemma-hello-world:${git_short_hash}

    # Utilize OneDev's caching to speed up dependency downloads
    cache:
      go_mod:
        path: go.mod
        key: go-mod-${{ git_commit }}

    # Enable artifact passing between jobs for multi-stage workflows
    artifacts:
      server_binary:
        - server

    # Apply conditional execution based on branch for selective builds
    on:
      branch:
        - main
        - develop
